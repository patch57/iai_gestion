{% if fiches_rattrapage %}
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    {% for f in fiches_rattrapage %}
    {% include 'notes/includes/pv_card_item.html' with fiche=f type_badge="RATTRAPAGE" badge_bg="bg-rose-100 text-rose-800" %}
    {% endfor %}
</div>
{% else %}
<div class="bg-white rounded-3xl p-12 text-center border border-gray-100 shadow-md">
    <i class="fas fa-redo text-4xl text-gray-300 mb-3 block"></i>
    <p class="text-sm font-bold text-gray-600">Aucun Procès-Verbal de Rattrapage trouvé.</p>
</div>
{% endif %}

{% if fiches_examen %}
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    {% for f in fiches_examen %}
    {% include 'notes/includes/pv_card_item.html' with fiche=f type_badge="EXAMEN" badge_bg="bg-amber-100 text-amber-800" %}
    {% endfor %}
</div>
{% else %}
<div class="bg-white rounded-3xl p-12 text-center border border-gray-100 shadow-md">
    <i class="fas fa-file-invoice text-4xl text-gray-300 mb-3 block"></i>
    <p class="text-sm font-bold text-gray-600">Aucun Procès-Verbal d'Examen trouvé.</p>
</div>
{% endif %}

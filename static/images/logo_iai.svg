<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 270" width="300" height="270">
  <!-- Fond Jaune Doux -->
  <rect width="300" height="270" fill="#FFF8C5" rx="8"/>
  
  <!-- Bandes/Lettres d'arrière plan "I A I" -->
  <path d="M 30,0 L 75,0 L 75,270 L 30,270 Z" fill="#EADBAA" opacity="0.45"/>
  <path d="M 125,0 L 175,0 L 175,270 L 125,270 Z" fill="#EADBAA" opacity="0.3"/>
  <path d="M 225,0 L 270,0 L 270,270 L 225,270 Z" fill="#EADBAA" opacity="0.45"/>
  
  <!-- Contour Carte d'Afrique en vert fonce -->
  <path d="M 115,20 C 135,15 185,25 200,60 C 215,90 250,105 250,130 C 250,160 210,200 190,220 C 170,240 155,255 145,255 C 135,255 130,225 125,195 C 120,165 95,120 105,100 C 115,80 100,50 115,20 Z" fill="none" stroke="#004D25" stroke-width="4.5" stroke-linejoin="round"/>
  <!-- Ile de Madagascar -->
  <path d="M 235,180 C 238,170 242,175 240,195 C 238,210 232,215 235,180 Z" fill="none" stroke="#004D25" stroke-width="3"/>

  <!-- Sphere des Drapeaux Africains au centre de l'Afrique -->
  <g transform="translate(152, 115)">
    <circle cx="0" cy="0" r="38" fill="#007A3D" stroke="#004D25" stroke-width="2"/>
    <path d="M -38,0 A 38,38 0 0,1 38,0 Z" fill="#CE1126"/>
    <path d="M 0,-38 A 38,38 0 0,1 0,38 Z" fill="#FCD116" opacity="0.85"/>
    <rect x="-14" y="-14" width="28" height="28" fill="#00247D" rx="3"/>
    <circle cx="0" cy="0" r="7" fill="#FFFFFF"/>
    <!-- Bandes de couleur representant l'unite africaine -->
    <path d="M -26,-26 L 26,26" stroke="#CE1126" stroke-width="4"/>
    <path d="M -26,26 L 26,-26" stroke="#FCD116" stroke-width="4"/>
  </g>

  <!-- Texte en Arc au bas "Institut Africain d'Informatique" -->
  <path id="textArcBottom" d="M 15,205 A 165,165 0 0,0 285,205" fill="none"/>
  <text font-family="'Arial', 'Helvetica', sans-serif" font-size="20" font-weight="900" fill="#004D25" letter-spacing="0.5">
    <textPath href="#textArcBottom" startOffset="50%" text-anchor="middle">
      Institut Africain d'Informatique
    </textPath>
  </text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <!-- Fond Jaune Doux -->
  <rect width="300" height="300" rx="20" fill="#FFF8C5"/>
  
  <!-- Bandes d'arrière plan -->
  <path d="M 40,0 L 80,0 L 80,300 L 40,300 Z" fill="#EADBAA" opacity="0.5"/>
  <path d="M 220,0 L 260,0 L 260,300 L 220,300 Z" fill="#EADBAA" opacity="0.5"/>
  
  <!-- Contour Carte d'Afrique -->
  <path d="M 120,40 C 140,35 180,45 195,80 C 210,110 240,125 240,150 C 240,180 200,220 180,240 C 160,260 145,285 135,285 C 125,285 120,250 115,220 C 110,190 90,140 100,120 C 110,100 100,70 120,40 Z" fill="none" stroke="#004D25" stroke-width="4.5" stroke-linejoin="round"/>

  <!-- Sphère Drapeau Afrique Centrale au centre -->
  <g transform="translate(150, 130)">
    <circle cx="0" cy="0" r="42" fill="#007A3D" stroke="#004D25" stroke-width="2"/>
    <!-- Quartiers et couleurs drapeaux -->
    <path d="M -42,0 A 42,42 0 0,1 42,0 Z" fill="#CE1126"/>
    <path d="M 0,-42 A 42,42 0 0,1 0,42 Z" fill="#FCD116" opacity="0.8"/>
    <rect x="-15" y="-15" width="30" height="30" fill="#00247D" rx="4"/>
    <circle cx="0" cy="0" r="8" fill="#FFFFFF"/>
  </g>

  <!-- Texte en Arc "Institut Africain d'Informatique" -->
  <path id="textArc" d="M 20,240 A 135,135 0 0,0 280,240" fill="none"/>
  <text font-family="Arial, sans-serif" font-size="21" font-weight="900" fill="#004D25" letter-spacing="1">
    <textPath href="#textArc" startOffset="50%" text-anchor="middle">
      Institut Africain d'Informatique
    </textPath>
  </text>
</svg>
